name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Remove credentials, tokens and internal hostnames** from
        anything you paste below.
  - type: input
    id: version
    attributes:
      label: mqx version
      description: Output of `mqx version`.
    validations:
      required: true
  - type: dropdown
    id: broker
    attributes:
      label: Broker
      options:
        - Kafka
        - RabbitMQ
        - Both
        - Not broker related
    validations:
      required: true
  - type: input
    id: broker-version
    attributes:
      label: Broker version and deployment
      description: For example "Kafka 3.7 KRaft, Confluent Cloud" or "RabbitMQ 4.0 in Docker".
  - type: input
    id: os
    attributes:
      label: Operating system and terminal
      description: For example "macOS 15, iTerm2" or "Windows 11, Windows Terminal".
  - type: textarea
    id: command
    attributes:
      label: What did you run?
      description: The command, or the TUI panel and keys you pressed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Paste the output or error. Use `-o json` if it helps.
    validations:
      required: true
