name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Measure coverage
        run: |
          go test -covermode=atomic -coverprofile=coverage.out ./...
          echo "::notice title=coverage-total::$(go tool cover -func=coverage.out | tail -n 1)"
          go test -cover ./... 2>&1 | grep -v 'no test files' | while read -r l; do echo "::notice title=coverage-pkg::$l"; done
          {
            echo '### Coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
            echo '<details><summary>Per package</summary>'
            echo
            echo '```'
            go test -cover ./... 2>&1 | grep -v 'no test files'
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # testcontainers starts Kafka, Schema Registry, Connect, ksqlDB and RabbitMQ.
      - run: go test -tags integration -timeout 40m ./...
